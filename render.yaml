services:
  - type: web
    name: honeypot-api-guvi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_PROVIDER
        value: openai
      - key: GUVI_CALLBACK_URL
        value: https://hackathon.guvi.in/api/updateHoneyPotFinalResult
      - key: MAX_CONVERSATION_TURNS
        value: 20
      - key: SCAM_CONFIDENCE_THRESHOLD
        value: 0.7
      - key: MIN_MESSAGES_BEFORE_CALLBACK
        value: 5
      - key: DEBUG
        value: false
